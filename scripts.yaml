hooks: dart run hooksman register

gen:
  sync:
    (aliases): s
    (command): bash tool/sync_gen.sh
  clean:
    (command): rm -rf gen

build_runner:
  (aliases): br
  build:
    (aliases): b
    (command): dart run build_runner build --delete-conflicting-outputs
  clean:
    (aliases): c
    (command): dart run build_runner clean
  watch:
    (aliases): w
    (command): dart run build_runner watch --delete-conflicting-outputs

barrel: barreler build

test: dart test

lint:
  # Paths are listed explicitly because `dart format .` walks into the
  # gitignored gen/ checkout. `sip gen sync` resets that tree to upstream with
  # `checkout --force` + `clean -fdx`, so an unscoped format always finds
  # unformatted files there and fails — including inside `sip publish`, which
  # syncs immediately before linting.
  - (+) dart format bin example hooks lib test tool --set-exit-if-changed
  - (+) dart analyze --fatal-infos --fatal-warnings

publish:
  (bail): true
  (command):
    - |
      # Path/git deps cannot be published to pub.dev.
      if grep -E '^\s*path:\s*gen/' pubspec.yaml >/dev/null 2>&1; then
        echo ""
        echo "ERROR: pubspec.yaml still has path: gen/ dependencies."
        echo "Use hosted nocterm and committed lib/src/vendor/ copies of"
        echo "nocterm_provider / nocterm_nested (sip run gen sync runs vendor_from_gen)."
        echo ""
        exit 1
      fi
      if grep -E '^\s*(path|git):' pubspec.yaml >/dev/null 2>&1; then
        echo ""
        echo "ERROR: pubspec.yaml has path/git dependencies — not publishable."
        echo ""
        exit 1
      fi
    - sip run gen sync
    # Scoped to test/ for the same reason as the pre-commit hook: --recursive
    # walks into the gitignored gen/ checkout and tries to run the vendored
    # packages' own tests.
    - sip test --bail --concurrent test/
    - "{$lint}"
    - dart pub publish --dry-run
    - |
      # Sync changelog and pubspec versions
      version=$(grep -m 1 "# " CHANGELOG.md | awk '{print $2}')

      echo "Updating pubspec.yaml version to $version"
      sed -i '' "s|^version: .*|version: $version|g" "pubspec.yaml"
    - dart pub publish
    - "{$publish:commit}"
    - "{$publish:tag}"
    - "{$publish:_push}"
  commit: |
    # get version from changelog
    version=$(grep -m 1 "# " CHANGELOG.md | awk '{print $2}')

    echo "Committing version $version"
    git add .
    git commit -m "v$version"
  tag: |
    # get version from changelog
    version=$(grep -m 1 "# " CHANGELOG.md | awk '{print $2}')

    echo "Tagging version $version"
    git tag -a "v$version" -m "v$version"
  _push: |
    echo "Pushing to origin"
    git push
    git push --tags

install:
  - sip gen sync
  - rm -rf .dart_tool
  - dart pub get
  - dart pub global activate . --source path --overwrite
