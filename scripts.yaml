hooks: dart run hooksman register

gen:
  sync:
    (aliases): s
    (command): bash tool/sync_gen.sh
  clean:
    (command): rm -rf gen

build_runner:
  (aliases): br
  build:
    (aliases): b
    (command): dart run build_runner build --delete-conflicting-outputs
  clean:
    (aliases): c
    (command): dart run build_runner clean
  watch:
    (aliases): w
    (command): dart run build_runner watch --delete-conflicting-outputs

barrel: barreler build

test: dart test

lint:
  - (+) dart format . --set-exit-if-changed
  - (+) dart analyze --fatal-infos --fatal-warnings

publish:
  (bail):
  (command):
    - |
      # Path deps to gen/ cannot be published to pub.dev.
      if grep -E '^\s*path:\s*gen/' pubspec.yaml >/dev/null 2>&1; then
        echo ""
        echo "ERROR: pubspec.yaml still has path: gen/ dependencies."
        echo "hooksman cannot be published to pub.dev while nocterm is vendored"
        echo "via gen/. Keep using sip gen sync for local/dev."
        echo ""
        echo "Publish awaits hosted nocterm / nocterm_provider packages,"
        echo "or inlining a non-TUI fallback. See README § Publishing."
        echo ""
        exit 1
      fi
    - sip gen sync
    - sip test --bail --recursive --concurrent
    - "{$lint}"
    - |
      # Sync changelog and pubspec versions
      version=$(grep -m 1 "# " CHANGELOG.md | awk '{print $2}')

      echo "Updating pubspec.yaml version to $version"
      sed -i '' "s|^version: .*|version: $version|g" "pubspec.yaml"
    - dart pub publish
    - "{$publish:commit}"
    - "{$publish:tag}"
    - "{$publish:_push}"
  commit: |
    # get version from changelog
    version=$(grep -m 1 "# " CHANGELOG.md | awk '{print $2}')

    echo "Committing version $version"
    git add .
    git commit -m "v$version"
  tag: |
    # get version from changelog
    version=$(grep -m 1 "# " CHANGELOG.md | awk '{print $2}')

    echo "Tagging version $version"
    git tag -a "v$version" -m "v$version"
  _push: |
    echo "Pushing to origin"
    git push
    git push --tags

install:
  - sip gen sync
  - rm -rf .dart_tool
  - dart pub get
  - dart pub global activate . --source path --overwrite
